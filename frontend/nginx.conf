server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Soporte SPA: cualquier ruta de React Router (/login, /admin, /auth/google/callback, etc.) devuelve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Caché larga para assets estáticos con hash generados por Vite
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
